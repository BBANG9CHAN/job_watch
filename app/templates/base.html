<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{% block title %}Job Watch{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔭</text></svg>">
  <link rel="stylesheet" href="/static/style.css?v=4">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/">🔭<span class="brand-text"> Job Watch</span></a>
      <nav class="nav">
        <a href="/" class="{{ 'active' if nav == 'home' }}">홈</a>
        <a href="/jobs" class="{{ 'active' if nav == 'jobs' }}">공고</a>
        <a href="/watches" class="{{ 'active' if nav == 'watches' }}">모니터링</a>
        <a href="/settings" class="{{ 'active' if nav == 'settings' }}">설정</a>
      </nav>
    </div>
  </header>
  <main class="container">
    {% if msg %}<div class="flash">{{ msg }}</div>{% endif %}
    {% block content %}{% endblock %}
  </main>
  {% include "_app_modal.html" %}
  <script>window.STAGES = {{ STAGES | tojson }};</script>
  <script src="/static/app.js?v=3"></script>
</body>
</html>
